services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15436}:5432"

  backend:
    image: smk-multica-integration-replay-backend:20260915-legacy-success-v4
    environment:
      APP_ENV: development
      FRONTEND_ORIGIN: http://localhost:13003
      CORS_ALLOWED_ORIGINS: ""
      MULTICA_APP_URL: http://localhost:13003
      MULTICA_PUBLIC_URL: ""
      MULTICA_DAEMON_SERVER_URL: http://127.0.0.1:18083
      MULTICA_WORKFLOW_CONTROLLER_ID: 00000000-0000-4000-8000-000000001402
      MULTICA_DEV_VERIFICATION_CODE: ${ITEM14_REPLAY_DEV_CODE:?ITEM14_REPLAY_DEV_CODE is required}
      MULTICA_LLM_API_KEY: ""
      MULTICA_LLM_BASE_URL: ""
      MULTICA_LLM_DEFAULT_MODEL: ""
      MULTICA_LLM_MAX_RETRIES: "0"
      MULTICA_OWNER_SMS_MODE: "off"
      ANALYTICS_DISABLED: "true"
      POSTHOG_API_KEY: ""
      RESEND_API_KEY: ""
      SMTP_HOST: ""
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      MULTICA_CLOUD_URL: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GITHUB_APP_ID: ""
      GITHUB_APP_PRIVATE_KEY: ""
      GITHUB_WEBHOOK_SECRET: ""
      MULTICA_PLUGIN_SECRET_KEY: ""
      MULTICA_PLUGIN_SURFACE_ORIGIN: ""
      MULTICA_PLUGIN_API_URL: ""
      MULTICA_PLUGIN_DIR: ""
      MULTICA_VCS_INTEGRATION_ENABLED: "false"
      MULTICA_VCS_SECRET_KEY: ""
      MULTICA_LARK_SECRET_KEY: ""
      MULTICA_LARK_HTTP_BASE_URL: ""
      MULTICA_LARK_CALLBACK_BASE_URL: ""
      MULTICA_SLACK_SECRET_KEY: ""
      MULTICA_WECOM_SECRET_KEY: ""
      MULTICA_WECOM_MEDIA_ALLOW_CIDRS: ""
      MULTICA_WECOM_TRACE: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      S3_BUCKET: ""
      CLOUDFRONT_PRIVATE_KEY: ""
      TELNYX_API_KEY: ""
      TELNYX_PHONE_NUMBER: ""
      TELNYX_MESSAGING_PROFILE_ID: ""

  frontend:
    image: smk-multica-integration-web:20260914
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""

services:
  postgres:
    image: ${MULTICA_POSTGRES_IMAGE:?MULTICA_POSTGRES_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - multica_pgdata:/var/lib/postgresql/data

  backend:
    image: ${MULTICA_BACKEND_IMAGE:?MULTICA_BACKEND_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes: !override
      - multica_backend_uploads:/app/data/uploads
      - ${MULTICA_RECOVERY_STATE_PATH:?MULTICA_RECOVERY_STATE_PATH is required}:/app/data/recovery-state:ro
      - ${MULTICA_FEATURE_FLAGS_PATH:?MULTICA_FEATURE_FLAGS_PATH is required}:/run/secrets/multica/feature-flags.yml:ro
      - /Users/a32/.config/silver-mediums/multica/brain.json:/run/secrets/multica-brain/config.json:ro
      - /Users/a32/.config/silver-mediums/multica/brain.token:/run/secrets/multica-brain/token:ro
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: production
      PORT: "8080"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      MULTICA_APP_URL: ${MULTICA_APP_URL:?MULTICA_APP_URL is required}
      MULTICA_DAEMON_SERVER_URL: ${MULTICA_DAEMON_SERVER_URL:?MULTICA_DAEMON_SERVER_URL is required}
      LOCAL_UPLOAD_BASE_URL: ${LOCAL_UPLOAD_BASE_URL:?LOCAL_UPLOAD_BASE_URL is required}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-true}
      MULTICA_PRIVATE_ACCESS_CODE_LOGIN: ${MULTICA_PRIVATE_ACCESS_CODE_LOGIN:-false}
      MULTICA_PRIVATE_ACCESS_CODE: ${MULTICA_PRIVATE_ACCESS_CODE:-}
      FF_PLUGINS_V1: ${FF_PLUGINS_V1:-false}
      MULTICA_FEATURE_FLAGS_FILE: /run/secrets/multica/feature-flags.yml
      MULTICA_OWNER_SMS_MODE: ${MULTICA_OWNER_SMS_MODE:-off}
      MULTICA_LLM_MAX_RETRIES: ${MULTICA_LLM_MAX_RETRIES:-0}
      MULTICA_LLM_BASE_URL: ${MULTICA_LLM_BASE_URL:-}
      MULTICA_LLM_DEFAULT_MODEL: ${MULTICA_LLM_DEFAULT_MODEL:-}
      MULTICA_INTELLIGENCE_BASE_URL: ${MULTICA_INTELLIGENCE_BASE_URL:-}
      MULTICA_INTELLIGENCE_WRITER_TOKEN: ${MULTICA_INTELLIGENCE_WRITER_TOKEN:-}
      MULTICA_INTELLIGENCE_READER_TOKEN: ${MULTICA_INTELLIGENCE_READER_TOKEN:-}
      MULTICA_BRAIN_CONFIG: /run/secrets/multica-brain/config.json
      MULTICA_VCS_INTEGRATION_ENABLED: ${MULTICA_VCS_INTEGRATION_ENABLED:-false}
      MULTICA_WORKFLOW_DRIVER: ${MULTICA_WORKFLOW_DRIVER:-true}
      MULTICA_WORKFLOW_DRIVER_INTERVAL: ${MULTICA_WORKFLOW_DRIVER_INTERVAL:-60s}
      MULTICA_WORKFLOW_DRIVER_CAPACITY_BACKOFF: ${MULTICA_WORKFLOW_DRIVER_CAPACITY_BACKOFF:-60s}
      MULTICA_WORKFLOW_CONTROLLER_ID: ${MULTICA_WORKFLOW_CONTROLLER_ID:?MULTICA_WORKFLOW_CONTROLLER_ID is required}
      MULTICA_RECOVERY_STATE_DIR: /app/data/recovery-state
      DO_NOT_TRACK: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 60

  frontend:
    image: ${MULTICA_WEB_IMAGE:?MULTICA_WEB_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 3s
      timeout: 5s
      retries: 60

volumes:
  multica_pgdata:
    external: true
    name: ${MULTICA_PGDATA_VOLUME:-multica_pgdata}
  multica_backend_uploads:
    external: true
    name: ${MULTICA_UPLOADS_VOLUME:-multica_backend_uploads}

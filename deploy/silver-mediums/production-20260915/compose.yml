# Overlay for docker-compose.selfhost.yml. Exact locally reviewed image bytes.
# Used only through scripts/production-release.ps1 with the existing secret file.
services:
  postgres:
    image: sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    pull_policy: never
  backend:
    image: sha256:126d388925dec5a4a4b672e88b826c3cc9d59a8691baed9a11623d4b6efb8483
    pull_policy: never
    ports: !override
      - "127.0.0.1:8080:8080"
    volumes: !override
      - backend_uploads:/app/data/uploads
      - C:/Dev/SMK-multica-selfhost-pilot/recovery/state:/app/data/recovery-state:ro
    environment: !override
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Existing production JWT secret is required}
      APP_ENV: production
      PORT: "8080"
      FRONTEND_ORIGIN: https://a9drew.tailda9924.ts.net
      CORS_ALLOWED_ORIGINS: https://a9drew.tailda9924.ts.net
      MULTICA_APP_URL: https://a9drew.tailda9924.ts.net
      MULTICA_DAEMON_SERVER_URL: https://a9drew.tailda9924.ts.net
      LOCAL_UPLOAD_BASE_URL: https://a9drew.tailda9924.ts.net
      ALLOW_SIGNUP: "false"
      DISABLE_WORKSPACE_CREATION: "true"
      MULTICA_OWNER_SMS_MODE: "off"
      MULTICA_LLM_MAX_RETRIES: "0"
      MULTICA_WORKFLOW_CONTROLLER_ID: c43dc900-4554-4cbb-a664-759067b81118
      MULTICA_VCS_INTEGRATION_ENABLED: "false"
      MULTICA_RECOVERY_STATE_DIR: /app/data/recovery-state
      DO_NOT_TRACK: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 40
  frontend:
    image: sha256:de3c18a6faccbec926def3241521c484a63c25f67d29f2bd442bf1628db2b548
    pull_policy: never
    ports: !override
      - "127.0.0.1:3000:3000"
    environment: !override
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 3s
      timeout: 5s
      retries: 40
volumes:
  pgdata:
    external: true
    name: multica_pgdata
  backend_uploads:
    external: true
    name: multica_backend_uploads

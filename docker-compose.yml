name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be set; use a named local project or scripts/adoption-release.ps1}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

# Provider-free, loopback-only preview of this checkout. No inherited .env.
name: smk-local-candidate-20260915

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica_preview
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: local-preview-only
    volumes:
      - preview_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multica -d multica_preview"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    image: smk-local-candidate-backend:20260915
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local-candidate-20260915
        COMMIT: ${CANDIDATE_SOURCE_ID:?Run scripts/local-candidate.ps1 first}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://multica:local-preview-only@postgres:5432/multica_preview?sslmode=disable
      APP_ENV: development
      PORT: "8080"
      FRONTEND_URL: http://127.0.0.1:13004
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:13004,http://localhost:13004
      ALLOW_SIGNUP: "true"
      MULTICA_DEV_VERIFICATION_CODE: "654321"
      MULTICA_OWNER_SMS_MODE: "off"
      MULTICA_LLM_MAX_RETRIES: "0"
      DO_NOT_TRACK: "1"
      GOMAXPROCS: "2"
    volumes:
      - preview_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 40

  frontend:
    image: smk-local-candidate-web:20260915
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_VERSION: local-candidate-20260915
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REMOTE_API_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 3s
      timeout: 5s
      retries: 30

  gateway:
    image: smk-local-candidate-gateway:20260915
    build:
      context: .
      dockerfile: Dockerfile.local-candidate-gateway
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:13004:3000"
      - "127.0.0.1:18084:8080"
      - "127.0.0.1:15437:5432"
    networks: [default, entry]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "for (const port of [3000,8080]) { const response = await fetch('http://127.0.0.1:'+port+(port===3000?'/login':'/healthz')); if (!response.ok) process.exit(1); }"]
      interval: 3s
      timeout: 5s
      retries: 30

networks:
  default:
    internal: true
  entry: {}

volumes:
  preview_database:
  preview_uploads:
